<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Megaphone / Announcement Signal Graphic -->
  <g transform="translate(64, 76)" filter="url(#glow)">
    <!-- Signal waves -->
    <path d="M 280 140 A 60 60 0 0 1 280 220" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 310 110 A 100 100 0 0 1 310 250" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" opacity="0.7" />
    <path d="M 340 80 A 140 140 0 0 1 340 280" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" opacity="0.4" />

    <!-- Megaphone body -->
    <path d="M 60 150 L 150 150 L 250 80 L 250 280 L 150 210 L 60 210 Z" fill="url(#accentGrad)" />
    <!-- Handle -->
    <path d="M 120 210 L 100 290 L 140 290 L 150 210 Z" fill="#6366f1" />
    <!-- Pulse dot -->
    <circle cx="60" cy="180" r="16" fill="#38bdf8" />
  </g>
</svg>
